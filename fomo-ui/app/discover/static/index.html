<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FOMO Discover</title>
  <link rel="stylesheet" href="fomo.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1><a href="/">FOMO</a> / Discover</h1>
  </header>

  <main class="panel">
    <div class="mode-bar">
      <button class="mode-btn active" data-mode="similar_tracks">Similar tracks</button>
      <button class="mode-btn" data-mode="similar_artists">Similar artists</button>
      <button class="mode-btn" data-mode="song">Song lookup</button>
      <button class="mode-btn" data-mode="discography">Discography</button>
    </div>

    <div class="search-bar">
      <input id="query-input" type="text" autofocus>
      <button id="search-btn" type="button">Search</button>
    </div>

    <p id="status" class="panel-status hidden"></p>
    <div id="results"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
