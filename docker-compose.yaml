services:
    owntone:
        image: owntone/owntone:latest
        container_name: owntone
        network_mode: host
        restart: unless-stopped
        environment:
            TZ: Europe/London
        volumes:
            - ${OWNTONE_CONFIG_DIR}:/etc/owntone
            - ${OWNTONE_CACHE_DIR}:/var/cache/owntone
            - ${ST_SAVE_DIR}:/srv/music:ro
            - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
        entrypoint: ["/usr/sbin/owntone"]
        command: ["-f", "-c", "/etc/owntone/owntone.conf"]
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "5"
    rfid-daemon:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: rfid-daemon
        network_mode: host
        restart: unless-stopped
        environment:
            FOMO_DB: /data/fomo.db
            OWNTONE_API: ${OWNTONE_API}
        volumes:
            - ${SPEAKER_DIR}:/data
        devices:
            - /dev/input/event4:/dev/input/event4:ro
        privileged: true
        tmpfs:
            - /tmp
            - /var/tmp
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "5"
    mpd-proxy:
        build:
            context: .
            dockerfile: mpd-proxy/Dockerfile
        container_name: mpd-proxy
        network_mode: host
        restart: unless-stopped
        environment:
            MPD_PROXY_PORT: "6601"
            MPD_UPSTREAM_HOST: "127.0.0.1"
            MPD_UPSTREAM_PORT: "6600"
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "5"
    authelia:
        image: authelia/authelia:latest
        container_name: authelia
        restart: unless-stopped
        ports:
            - "9091:9091"
        volumes:
            - /home/pi4/authelia:/config
        environment:
            TZ: Europe/London
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "5"
    fomo-ui:
        build:
            context: .
            dockerfile: fomo-ui/Dockerfile
        container_name: fomo-ui
        ports:
            - "3050:3050"
        restart: unless-stopped
        extra_hosts:
            - "host.docker.internal:host-gateway"
        environment:
            SAVE_DIR: /music
            MUSIC_ROOT: /music
            OWNTONE_BASE: http://host.docker.internal:3689/api
            OWNTONE_API: http://host.docker.internal:3689/api
            FOMO_DB: /data/fomo.db
        volumes:
            - ${ST_SAVE_DIR}:/music
            - ${SPEAKER_DIR}:/data
            - /var/run/docker.sock:/var/run/docker.sock:ro
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "5"
