services:
    rfid-daemon:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: rfid-daemon
        network_mode: host
        restart: unless-stopped
        environment:
            TAGS_FILE: /host/speaker/${TAGS_FILE}
            OWNTONE_API: ${OWNTONE_API}
        volumes:
            - ${SPEAKER_DIR}:/host/speaker:ro
        devices:
            - /dev/input/event4:/dev/input/event4:ro
        privileged: true
        read_only: true
        tmpfs:
            - /tmp
            - /var/tmp
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "5"

    metadata-webui:
        build:
            context: metadata-webui
            dockerfile: Dockerfile
        container_name: metadata-webui
        ports:
            - "3030:3030"
        restart: unless-stopped
        environment:
            MUSIC_ROOT: /music
            OWNTONE_BASE: ${OWNTONE_API}
        volumes:
            - ${ST_SAVE_DIR}:/music
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

    tag-organizer:
        build:
            context: tag-organizer
            dockerfile: Dockerfile
        container_name: tag-organizer
        network_mode: host
        restart: unless-stopped
        environment:
            TAGS_FILE: /data/tags.yaml
            OWNTONE_API: ${OWNTONE_API}
        volumes:
            - ${SPEAKER_DIR}:/data
            - /var/run/docker.sock:/var/run/docker.sock:ro
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"
