services:
    owntone:
        image: owntone/owntone:latest
        container_name: owntone
        network_mode: host
        restart: unless-stopped
        environment:
            TZ: Europe/London
        volumes:
            - ${OWNTONE_CONFIG_DIR}:/etc/owntone
            - ${OWNTONE_CACHE_DIR}:/var/cache/owntone
            - ${ST_SAVE_DIR}:/srv/music:ro
            - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
        entrypoint: ["/usr/sbin/owntone"]
        command: ["-f", "-c", "/etc/owntone/owntone.conf"]
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "5"
    rfid-daemon:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: rfid-daemon
        network_mode: host
        restart: unless-stopped
        environment:
            FOMO_DB: /data/fomo.db
            OWNTONE_API: ${OWNTONE_API}
        volumes:
            - ${SPEAKER_DIR}:/data
        devices:
            - /dev/input/event4:/dev/input/event4:ro
        privileged: true
        tmpfs:
            - /tmp
            - /var/tmp
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "5"
    metadata-webui:
        build:
            context: .
            dockerfile: metadata-webui/Dockerfile
        container_name: metadata-webui
        ports:
            - "3030:3030"
        restart: unless-stopped
        extra_hosts:
            - "host.docker.internal:host-gateway"
        environment:
            MUSIC_ROOT: /music
            OWNTONE_BASE: http://host.docker.internal:3689/api
        volumes:
            - ${ST_SAVE_DIR}:/music
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"
    tag-organizer:
        build:
            context: .
            dockerfile: tag-organizer/Dockerfile
        container_name: tag-organizer
        network_mode: host
        restart: unless-stopped
        environment:
            FOMO_DB: /data/fomo.db
            OWNTONE_API: ${OWNTONE_API}
        volumes:
            - ${SPEAKER_DIR}:/data
            - /var/run/docker.sock:/var/run/docker.sock:ro
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

    downloader:
        build:
            context: .
            dockerfile: downloader/Dockerfile
        container_name: downloader
        ports:
            - "3050:3050"
        restart: unless-stopped
        environment:
            SAVE_DIR: /music
        volumes:
            - ${ST_SAVE_DIR}:/music
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"
