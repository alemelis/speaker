# FOMO nginx config (reference — not auto-deployed)
# Place relevant blocks inside your server {} block.

# Landing page (static files from disk)
location / {
    root /home/pi4/speaker/landing;
    index index.html;
    try_files $uri $uri/ =404;
}

# Downloader — SSE requires buffering off
location = /download { return 301 /download/; }
location /download/ {
    proxy_pass http://127.0.0.1:3050/download/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection '';
    chunked_transfer_encoding on;
}

# Metadata editor (LAN only)
location = /metadata { return 301 /metadata/; }
location /metadata/ {
    proxy_pass http://127.0.0.1:3050/metadata/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# Tag organizer (LAN only)
location = /tags { return 301 /tags/; }
location /tags/ {
    proxy_pass http://127.0.0.1:3050/tags/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# Album-art proxy (covers shown in the tags/metadata UIs)
location /artwork/ {
    proxy_pass http://127.0.0.1:3050/artwork/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
