# ---------------------------------------------------------------------------
# FOMO — LAN access (pi4.local) — trusted local network, no auth required
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name pi4.local;

    # Downloader — SSE requires buffering off
    location = /download { return 301 /download/; }
    location /download/ {
        proxy_pass http://127.0.0.1:3050/download/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
    }

    # Metadata editor
    location = /metadata { return 301 /metadata/; }
    location /metadata/ {
        proxy_pass http://127.0.0.1:3050/metadata/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Tag organizer
    location = /tags { return 301 /tags/; }
    location /tags/ {
        proxy_pass http://127.0.0.1:3050/tags/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Album-art proxy
    location /artwork/ {
        proxy_pass http://127.0.0.1:3050/artwork/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Discover — SSE chat stream requires buffering off
    location = /discover { return 301 /discover/; }
    location /discover/ {
        proxy_pass http://127.0.0.1:3050/discover/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
    }

    # Album browser
    location = /browse { return 301 /browse/; }
    location /browse/ {
        proxy_pass http://127.0.0.1:3050/browse/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Landing page
    location / {
        root /home/pi4/speaker/landing;
        index index.html;
        try_files $uri $uri/ =404;
    }
}

# ---------------------------------------------------------------------------
# FOMO — public access (fomo.alemel.is via Cloudflare tunnel) — auth required
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name fomo.alemel.is;

    # Internal endpoint — Authelia forward-auth subrequest
    location ^~ /internal/authelia/authz {
        internal;
        proxy_pass http://127.0.0.1:9091/api/authz/auth-request;
        proxy_set_header Host $host;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-URL    "https://$host$request_uri";
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Content-Length    "";
        proxy_pass_request_body off;
    }

    # Landing page
    location / {
        auth_request /internal/authelia/authz;
        auth_request_set $redirect $upstream_http_location;
        error_page 401 =302 $redirect;

        root /home/pi4/speaker/landing;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Downloader — SSE requires buffering off
    location = /download { return 301 /download/; }
    location /download/ {
        auth_request /internal/authelia/authz;
        auth_request_set $redirect $upstream_http_location;
        error_page 401 =302 $redirect;

        proxy_pass http://127.0.0.1:3050/download/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
    }

    # Metadata editor
    location = /metadata { return 301 /metadata/; }
    location /metadata/ {
        auth_request /internal/authelia/authz;
        auth_request_set $redirect $upstream_http_location;
        error_page 401 =302 $redirect;

        proxy_pass http://127.0.0.1:3050/metadata/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Tag organizer
    location = /tags { return 301 /tags/; }
    location /tags/ {
        auth_request /internal/authelia/authz;
        auth_request_set $redirect $upstream_http_location;
        error_page 401 =302 $redirect;

        proxy_pass http://127.0.0.1:3050/tags/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Album-art proxy
    location /artwork/ {
        auth_request /internal/authelia/authz;
        auth_request_set $redirect $upstream_http_location;
        error_page 401 =302 $redirect;

        proxy_pass http://127.0.0.1:3050/artwork/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Discover — SSE chat stream requires buffering off
    location = /discover { return 301 /discover/; }
    location /discover/ {
        auth_request /internal/authelia/authz;
        auth_request_set $redirect $upstream_http_location;
        error_page 401 =302 $redirect;

        proxy_pass http://127.0.0.1:3050/discover/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
    }

    # Album browser
    location = /browse { return 301 /browse/; }
    location /browse/ {
        auth_request /internal/authelia/authz;
        auth_request_set $redirect $upstream_http_location;
        error_page 401 =302 $redirect;

        proxy_pass http://127.0.0.1:3050/browse/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# ---------------------------------------------------------------------------
# Authelia portal (auth.alemel.is) — no auth_request here
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name auth.alemel.is;

    location / {
        proxy_pass http://127.0.0.1:9091;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
