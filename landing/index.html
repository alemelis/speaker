<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>FOMO</title>
        <link rel="stylesheet" href="fomo.css" />
        <style>
            .home {
                max-width: 480px;
                margin: 4rem auto;
                padding: 0 1rem;
            }
            h1 {
                font-size: 2rem;
                margin: 0 0 0.25rem;
            }
            .tagline {
                color: #444;
                margin: 0 0 2.5rem;
                font-size: 0.95rem;
            }
            .cards {
                display: flex;
                flex-direction: column;
                gap: 1rem;
            }
            .card {
                display: block;
                border: 1px solid #000;
                padding: 1rem 1.25rem;
                text-decoration: none;
                color: #000;
            }
            .card:hover {
                background: #f3f3f3;
            }
            .card-title {
                font-weight: 700;
                font-size: 1rem;
                margin: 0 0 0.2rem;
            }
            .card-desc {
                font-size: 0.88rem;
                color: #444;
                margin: 0;
            }
        </style>
    </head>
    <body>
        <main class="home">
            <h1>FOMO</h1>

            <nav class="cards">
                <a class="card" href="/download/">
                    <p class="card-title">Download</p>
                    <p class="card-desc">
                        Grab tracks or playlists from YouTube via yt-dlp.
                    </p>
                </a>
                <a class="card" href="/metadata/">
                    <p class="card-title">Metadata</p>
                    <p class="card-desc">
                        Edit tags on your music library files.
                    </p>
                </a>
                <a class="card" href="/tags/">
                    <p class="card-title">Tags</p>
                    <p class="card-desc">
                        Manage NFC tag → track/album mappings.
                    </p>
                </a>
                <a class="card" href="/discover/">
                    <p class="card-title">Discover</p>
                    <p class="card-desc">Find similar tracks.</p>
                </a>
                <a class="card" href="/browse/">
                    <p class="card-title">Browse</p>
                    <p class="card-desc">Browse your library by album cover.</p>
                </a>
            </nav>
        </main>
    </body>
</html>
